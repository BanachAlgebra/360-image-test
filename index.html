<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="pannellum.css">
  <script src="pannellum.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

      width: 80%;
      height: 500px;
    }

</head>

  <script>

      autoLoad: true
    });
  </script>
</body>
</html>
